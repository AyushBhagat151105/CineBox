<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e18" />
      <stop offset="50%" stop-color="#07070c" />
      <stop offset="100%" stop-color="#030306" />
    </linearGradient>

    <!-- Crimson Neon Accent -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a26" />
      <stop offset="50%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#b80610" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="180" fill="#e50914" opacity="0.12" filter="blur(60px)" />
  <circle cx="1020" cy="300" r="220" fill="#f5c518" opacity="0.06" filter="blur(80px)" />

  <!-- Border Card Frame -->
  <rect x="20" y="20" width="1160" height="380" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Clapperboard / Film Icon Graphic -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="110" height="110" rx="28" fill="#141420" stroke="#e50914" stroke-width="2.5" filter="url(#subtleGlow)"/>
    <!-- Clapper Stripes -->
    <path d="M 15 38 L 95 38" stroke="#e50914" stroke-width="2.5" />
    <path d="M 28 14 L 42 38 M 52 14 L 66 38 M 76 14 L 90 38" stroke="#e50914" stroke-width="3" stroke-linecap="round"/>
    <!-- Play Triangle -->
    <polygon points="46,55 74,72 46,89" fill="url(#primaryGrad)" />
  </g>

  <!-- Title & Branding -->
  <text x="240" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="4" fill="#ffffff">
    CINE<tspan fill="url(#primaryGrad)">BOX</tspan>
  </text>

  <!-- Version Pill -->
  <g transform="translate(620, 120)">
    <rect x="0" y="0" width="84" height="28" rx="14" fill="rgba(229, 9, 20, 0.18)" stroke="#e50914" stroke-width="1" />
    <text x="42" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ff4d58" text-anchor="middle">v1.0.1</text>
  </g>

  <!-- Subtitle / Tagline -->
  <text x="242" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#9ca3af" letter-spacing="0.5">
    The Next-Generation Cinematic Streaming &amp; Federated Media Aggregator for Android
  </text>

  <!-- Badges / Feature Tags Row -->
  <g transform="translate(242, 260)">
    <!-- Pill 1: 4K UHD Remux -->
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#151522" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#e50914" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e5e7eb">4K UHD Remux</text>

    <!-- Pill 2: VLC Native Engine -->
    <g transform="translate(162, 0)">
      <rect x="0" y="0" width="168" height="34" rx="17" fill="#151522" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#ff9900" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e5e7eb">VLC Native Player</text>
    </g>

    <!-- Pill 3: Dolby Atmos & DTS-HD -->
    <g transform="translate(342, 0)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#151522" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#00d26a" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e5e7eb">Dolby Atmos • DTS-HD</text>
    </g>

    <!-- Pill 4: In-App OTA Updates -->
    <g transform="translate(534, 0)">
      <rect x="0" y="0" width="164" height="34" rx="17" fill="#151522" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e5e7eb">In-App OTA Updates</text>
    </g>

    <!-- Pill 5: Zero Telemetry -->
    <g transform="translate(710, 0)">
      <rect x="0" y="0" width="144" height="34" rx="17" fill="#151522" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#a855f7" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e5e7eb">Zero Telemetry</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(100, 330)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6b7280">
      ⚡ Expo SDK 58  •  React Native 0.88  •  Zustand  •  Native Android Intents  •  Chrome Custom Tabs
    </text>
    <text x="1000" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e50914" text-anchor="end">
      Engineered for Cinema Connoisseurs
    </text>
  </g>
</svg>